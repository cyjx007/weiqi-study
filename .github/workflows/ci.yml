name: ci

on:
  push:
  pull_request:

# 同一个 ref 只留最新一次运行：避免一次推送/补推产生多个排队任务和重复失败邮件
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System deps (GTK4 / libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: GUI smoke (Xvfb)
        run: |
          sudo apt-get install -y xvfb xdotool
          WEIQI_SMOKE_REQUIRE=1 WEIQI_GUI_BIN=target/release/weiqi-gui \
            timeout 180 ./scripts/gui-smoke.sh --switch --import
      - name: TUI smoke (pty)
        run: |
          WEIQI_TUI_BIN=target/release/weiqi-tui \
            timeout 60 python3 scripts/tui-smoke.py
      - name: TUI image protocol smoke (kitty/sixel encoders)
        run: |
          WEIQI_TUI_BIN=target/release/weiqi-tui \
            timeout 90 python3 scripts/tui-image-smoke.py

  # 最低支持版本必须和 Cargo.toml 的 rust-version、README 一致。
  # 依赖声明的 MSRV 里最高的是 gtk4/glib 0.22 一代（1.92）。
  msrv:
    name: msrv (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: System deps (GTK4 / libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Check on the declared MSRV
        run: cargo check --workspace --all-targets
