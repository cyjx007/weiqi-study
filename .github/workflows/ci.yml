name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System deps (GTK4 / libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: GUI smoke (Xvfb)
        run: |
          sudo apt-get install -y xvfb xdotool
          WEIQI_SMOKE_REQUIRE=1 WEIQI_GUI_BIN=target/release/weiqi-gui \
            timeout 120 ./scripts/gui-smoke.sh --switch
