# KataGo 分析配置（本地复盘用，OpenCL / GTX 1650 Ti 4G）
# 由 go-review 调用，可用 -override-config 临时覆盖
logDir = /home/tanghuang/go-study/logs
logToStderr = false
logErrorsAndWarnings = true

# 并行分析几个局面；线程越多批越大，但 4G 卡别贪
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20

# 所有胜率按「轮到谁走」报，go-review 再换算成同一方视角
reportAnalysisWinratesAs = SIDETOMOVE
analysisPVLen = 8
maxVisits = 120
